mode: ContinuousDeployment
major-version-bump-message: '(?i)(\+semver:\s?(breaking|major)|^[a-z]+(?:\([^)]+\))?!:|BREAKING CHANGE:)'
branches:
  main:
    regex: ^main$
    label: ''
  feature:
    mode: ContinuousDelivery
    regex: ^(features?|f2calv|copilot)[/-](?<BranchName>.+)
    label: '{BranchName}'
ignore:
  sha: []
merge-message-formats: {}
